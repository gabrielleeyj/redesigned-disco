services:
  # temporalio/temporal bundles the dev server (formerly temporalite)
  # with SQLite-backed storage and a built-in web UI. Use this for
  # local development; a production deployment would run a Temporal
  # cluster backed by Postgres/MySQL/Cassandra.
  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0 --ui-port 8233
    ports:
      - "7233:7233"   # gRPC frontend (Encore worker connects here)
      - "8233:8233"   # Web UI
